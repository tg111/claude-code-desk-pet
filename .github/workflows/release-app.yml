# ============================================================================
# 打包安装版并发布到 GitHub Releases
#
# 产物：Windows 安装包（.exe）、macOS 磁盘映像（.dmg，Apple 芯片与 Intel 各一个）、Linux AppImage。
#       打包脚本见 desk-pet/packaging/build.mjs。
#
# 触发：
#   - 推送形如 v0.4.0 的 tag：三个平台打包后创建同名 Release，并把安装包挂上去
#     （tag 必须与 desk-pet/package.json 的 version 一致；与 publish-npm 同一个 tag 触发）；
#   - 改动打包相关文件的 PR、或在 Actions 页面手动运行：只打包，安装包作为本次运行的 Artifacts 下载，不发 Release。
#
# 没有代码签名证书：Windows 首次运行会被 SmartScreen 拦一下，macOS 要在「隐私与安全性」里放行，
#       处理方法见 README「下载安装版」。
# ============================================================================

name: release-app

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'desk-pet/packaging/**'
      - 'desk-pet/runtime/electron-helper/**'
      - '.github/workflows/release-app.yml'
  workflow_dispatch:

permissions:
  contents: write # 创建 Release

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis --x64
          - os: macos-latest
            args: --mac dmg --arm64 --x64
          - os: ubuntu-latest
            args: --linux AppImage --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desk-pet
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desk-pet/pnpm-lock.yaml

      - name: 检查 tag 与 package.json 的 version 一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 version $version 不一致"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: npm run build

      - run: node packaging/build.mjs ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: desk-pet-${{ matrix.os }}
          path: |
            desk-pet/packaging/dist/*.exe
            desk-pet/packaging/dist/*.dmg
            desk-pet/packaging/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
